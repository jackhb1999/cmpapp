product:
  type: lib
  platforms: [ jvm, android ]

dependencies:
  - ../../core
  - ../jvmAndAndroid: exported
  - $libs.androidx.paging.common
  - $libs.androidx.paging.compose
  - $libs.androidx.room3.common
  - $libs.androidx.room3.runtime
  - $libs.androidx.room3.paging


dependencies@jvm:
  - $libs.kotlinx.coroutines.swing
  - $compose.desktop.currentOs
  - $libs.logback.classic
  - $libs.slf4j.api
  - $libs.slf4j.nop
  - io.github.oshai:kotlin-logging:8.0.01
  - ../jvmAndAndroid: exported

dependencies@android:
  - $libs.kotlinx.coroutines.android
  - $libs.androidx.core.splashscreen
  - $libs.androidx.activity.compose: exported
  - $libs.androidx.appcompat
  - $libs.androidx.compose.livedata
  - $libs.voyager.livedata


settings:
  jvm:
    jdk:
      version: 21
  compose:
    enabled: true
    version: 1.11.0
    experimental:
      hotReload:
        version: 1.0.0-rc03
  kotlin:
    serialization:
      enabled: true
      version: 1.11.0
    rpc: enabled

#settings@android:
