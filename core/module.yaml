product:
  type: lib
  platforms: [ jvm, android,wasmJs ]

dependencies:
  - $libs.kotlinx.coroutines.core: exported
  - $libs.kotlinx.datetime: exported
  - $libs.kotlinx.rpc.core: exported
  - $libs.kotlinx.serialization.core: exported
  - $libs.kotlinx.serialization.json: exported
  - $libs.ktor.serialization.kotlinx.json: exported
  - $libs.ktor.server.core
  - $libs.config: exported


test-dependencies@jvm:
  - $libs.kotlin.test
  - $libs.kotlin.test.junit5
  - org.junit.jupiter:junit-jupiter:5.14.0
  - org.junit.jupiter:junit-jupiter-api:5.14.0

settings:
  kotlin:
    serialization: enabled
    rpc: enabled
  junit: junit-5

test-settings:
  kotlin:
    serialization:
      enabled: true
  junit: junit-5

repositories:
  - https://mirrors.tencent.com/nexus/repository/maven-tencent
  - https://mirrors.tencent.com/nexus/repository/maven-public
