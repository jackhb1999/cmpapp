  - $libs.kotlinx.serialization.json
  - $libs.ktor.server.content.negotiation
  - $libs.postgresql
  - $libs.hikariCP
  - $libs.exposed.core
  - $libs.exposed.jdbc
  - $libs.exposed.datetime
  - $libs.exposed.dao
  - $libs.ktor.server.auth
  - $libs.ktor.server.auth.jwt
  - $libs.ktor.server.netty
  - $libs.ktor.server.config.yaml
  - $libs.ktor.utils
  - $libs.kotlinx.rpc.krpc.server
  - $libs.kotlinx.rpc.krpc.serialization.json
  - $libs.kotlinx.rpc.krpc.ktor.server
  - $libs.js.joda.core



