settings:
  jvm:
    jdk:
      version: 21
  compose:
    enabled: true
    resources:
      packageName: com.rustob.gen
    version: 1.10.3
  kotlin:
    serialization: enabled
    freeCompilerArgs:
      - -target=es2015
      - -source-map
      - -Xir-dce=true
      - -Xgenerate-dts
      - -Xes-long-as-bigint
      - -Xir-per-file
      # - -Xir-per-module
    optIns:
      - kotlin.js.ExperimentalJsExport
      - kotlin.js.ExperimentalWasmJsInterop



